services:
  unit:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: node --experimental-strip-types --test tests/*.test.ts
  browser:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    ipc: host
    volumes:
      - .:/app
      - browser_modules:/app/node_modules
    command: sh -lc "npm ci && node scripts/create-test-voice.mjs && npx playwright test"
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dev_modules:/app/node_modules
    ports:
      - '127.0.0.1:4173:4173'
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 4173"
volumes:
  browser_modules:
  dev_modules:
